# 在 GitHub 官方 runner 上构建 Kiwi (arm64) — v3 修复磁盘问题
# =============================================================================
# v2 失败原因（已从 Actions 诊断信息确诊）：
#   System.IO.IOException: No space left on device
#   根因：切换 tag 后执行了第二次全量 gclient sync，
#         新旧依赖叠加 + .git 对象膨胀，撑爆 145GB 磁盘
# 修正：
#   1. .gclient 的 URL 直接带版本号，只 sync 一次
#   2. 移除"切换版本后再次 sync"步骤
#   3. 最大化磁盘清理 + 全程监控 df
#   4. 用 --prune 移除无用依赖
# =============================================================================

name: 'Kiwi: GitHub-hosted Build arm64'

on:
  workflow_dispatch:
    inputs:
      packageName:
        description: 'APK 包名'
        required: true
        default: 'com.lengxiaobing.kiwi'
      appLabel:
        description: 'APP 显示名称'
        required: true
        default: 'KiwiX'
      chromiumTag:
        description: 'Chromium tag（默认 132.0.6834.83 = Kiwi 停更时的内核）'
        required: true
        default: '132.0.6834.83'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      # ================= 1. 极限腾空间 =================
      - name: 极限清理磁盘
        run: |
          echo "=== 清理前 ==="
          df -h /

          # 关闭 swap
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile || true

          # 删除巨型预装无用软件
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/local/lib/node_modules || true
          sudo rm -rf /opt/hostedtoolcache || true

          # 清理包缓存
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* || true
          sudo rm -rf /var/cache/apt/archives/* || true

          echo "=== 清理后 ==="
          df -h /

      - name: 检查磁盘（要求 >=110GB 可用）
        run: |
          AVAIL=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "可用空间: ${AVAIL}GB"
          if (( AVAIL < 110 )); then
            echo "::error::磁盘不足 110GB，编译必然失败"
            exit 1
          fi

      # ================= 2. 依赖 =================
      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            python3 python3-pip python3-venv \
            openjdk-17-jdk-headless \
            ccache ninja-build pkg-config file
          java -version 2>&1 | head -2
          ccache --max-size=2G
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: 安装 depot_tools
        run: |
          git clone --depth 1 \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            "$HOME/depot_tools"
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      # ================= 3. 单次 gclient sync =================
      - name: 配置 .gclient（版本直接写入 URL，避免二次 sync）
        run: |
          WS="$RUNNER_WORKSPACE/chromium"
          mkdir -p "$WS"
          cd "$WS"
          echo "WORKSPACE=$WS" >> $GITHUB_ENV

          TAG="${{ github.event.inputs.chromiumTag }}"

          # 关键：@TAG 直接锁定版本，一次到位
          cat > .gclient <<EOF
          solutions = [
            {
              "name": "src",
              "url": "https://chromium.googlesource.com/chromium/src.git@${TAG}",
              "managed": True,
              "custom_deps": {},
              "custom_vars": {},
            },
          ]
          target_os = ["android"]
          EOF

          echo "=== .gclient ==="
          cat .gclient

      - name: gclient sync（唯一一次，锁定版本）
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          cd "$WORKSPACE"
          echo "开始: $(date)"
          df -h /
          # --shallow: 只拉所需深度
          # --no-history: 不要完整历史
          # --revision: 确保版本一致
          gclient sync --nohooks --no-history --shallow -j 8
          echo "结束: $(date)"
          echo "=== 磁盘 ==="
          df -h /
          echo "=== 源码体积 ==="
          du -sh src 2>/dev/null || true
          echo "=== 验证版本 ==="
          cd src && git log -1 --oneline

      - name: 运行 hooks（下载工具链）
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          cd "$WORKSPACE"
          df -h /
          gclient runhooks
          echo "=== hooks 完成 ==="
          df -h /

      # ================= 4. Kiwi 补丁 =================
      - name: 检出 Kiwi 源码
        uses: actions/checkout@v4
        with:
          ref: kiwi
          path: kiwi-patch

      - name: 应用 Kiwi 定制
        run: |
          cd "$GITHUB_WORKSPACE/kiwi-patch"
          echo "=== 补丁文件数 ==="
          find . -type f -not -path "./.git/*" -not -path "./.github/*" | wc -l
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='.build' \
            --exclude='CHROMIUM_VERSION' --exclude='KIWI_VERSION' \
            --exclude='README.md' --exclude='LICENSE' --exclude='*.svg' \
            ./ "$WORKSPACE/src/"
          cd "$WORKSPACE/src"
          echo "=== 改动文件数 ==="
          git status --short | wc -l
          df -h /

      # ================= 5. 签名 =================
      - name: 生成 keystore
        run: |
          cd "$WORKSPACE"
          keytool -genkeypair -v \
            -keystore keystore.jks -alias kiwi \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass kiwi123456 -keypass kiwi123456 \
            -dname "CN=${{ github.event.inputs.appLabel }}, OU=Self, O=Self, L=CN, C=CN" 2>&1 | tail -3
          ls -lh keystore.jks

      # ================= 6. GN =================
      - name: 生成 args.gn
        run: |
          cd "$WORKSPACE"
          mkdir -p out/android_arm64
          {
            echo 'target_os = "android"'
            echo 'target_cpu = "arm64"'
            echo 'is_debug = false'
            echo 'is_java_debug = false'
            echo ''
            echo 'android_channel = "dev"'
            echo 'is_official_build = true'
            echo 'is_component_build = false'
            echo 'is_chrome_branded = false'
            echo 'is_clang = true'
            echo 'symbol_level = 0'
            echo 'exclude_unwind_tables = true'
            echo 'blink_symbol_level = 0'
            echo ''
            echo 'use_unofficial_version_number = false'
            echo 'android_default_version_code = "1"'
            echo 'android_default_version_name = "KiwiX"'
            echo ''
            echo 'chrome_public_manifest_package = "${{ github.event.inputs.packageName }}"'
            echo ''
            echo 'android_keystore_name = "kiwi"'
            echo 'android_keystore_password = "kiwi123456"'
            echo 'android_keystore_path = "../../keystore.jks"'
            echo ''
            echo 'enable_extensions = true'
            echo 'enable_pdf = false'
            echo 'enable_plugins = false'
            echo 'enable_nacl = false'
            echo 'enable_widevine = false'
            echo 'enable_remoting = false'
            echo 'enable_mse_mpeg2ts_stream_parser = false'
            echo 'rtc_use_h264 = false'
            echo ''
            echo 'proprietary_codecs = false'
            echo 'ffmpeg_branding = "Chromium"'
            echo ''
            echo 'google_api_key = "KIWIBROWSER"'
            echo 'google_default_client_id = "42.apps.kiwibrowser.com"'
            echo 'google_default_client_secret = "KIWIBROWSER_NOT_SO_SECRET"'
            echo 'use_official_google_api_keys = false'
            echo ''
            echo 'v8_use_external_startup_data = true'
            echo 'disable_android_lint = true'
            echo 'treat_warnings_as_errors = false'
            echo 'icu_use_data_file = false'
            echo 'enable_iterator_debugging = false'
            echo 'fieldtrial_testing_like_official_build = true'
            echo ''
            echo 'cc_wrapper = "ccache"'
          } > out/android_arm64/args.gn
          cat out/android_arm64/args.gn

      - name: gn gen
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          cd "$WORKSPACE"
          gn gen out/android_arm64
          echo "=== gn gen 成功 ==="
          df -h /

      # ================= 7. 编译 =================
      - name: 编译
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          cd "$WORKSPACE"
          echo "编译开始: $(date)"
          df -h /
          autoninja -C out/android_arm64 -j 4 chrome_public_apk
          echo "编译完成: $(date)"
          ccache -s || true
          df -h /

      # ================= 8. 产物 =================
      - name: 收集 APK
        if: always()
        run: |
          cd "$WORKSPACE" 2>/dev/null || exit 0
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          find out/android_arm64/apks -name "*.apk" -exec cp -v {} "$GITHUB_WORKSPACE/artifacts/" \; 2>/dev/null || echo "未找到 APK"
          ls -lh "$GITHUB_WORKSPACE/artifacts/" 2>/dev/null || true

      - name: 上传 APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiwi-arm64-apk
          path: ${{ github.workspace }}/artifacts/*.apk
          retention-days: 30
          if-no-files-found: warn
