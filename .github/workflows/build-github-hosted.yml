# 在 GitHub 官方 runner 上构建 Kiwi (arm64) — v2 修正版
# =============================================================================
# v1 失败原因（已从日志确诊）：
#   1. gclient 的 --reset-on-error / --retry-failures 参数已废弃 → 移除
#   2. fetch 未真正拉源码，只跑了 gclient config → 改为显式分步执行
#   3. 137.0.7337.0 不是 Chromium 真实 tag → 改用真实 tag
#   ✅ 意外发现：官方 runner 根盘有 145GB，磁盘不是瓶颈
# =============================================================================

name: 'Kiwi: GitHub-hosted Build arm64'

on:
  workflow_dispatch:
    inputs:
      packageName:
        description: 'APK 包名'
        required: true
        default: 'com.lengxiaobing.kiwi'
      appLabel:
        description: 'APP 显示名称'
        required: true
        default: 'KiwiX'
      chromiumTag:
        description: 'Chromium 真实 tag（如 131.0.6778.200，留空用 main 最新）'
        required: false
        default: '132.0.6834.83'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      # ---------- 1. 环境 ----------
      - name: 检查环境与磁盘
        run: |
          echo "=== CPU/内存 ==="
          nproc; free -h
          echo "=== 磁盘 ==="
          df -h /
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          sudo apt-get clean
          echo "=== 清理后 ==="
          df -h /

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 python3-pip python3-venv \
            openjdk-17-jdk-headless \
            ccache ninja-build pkg-config
          java -version 2>&1 | head -2
          python3 --version

      - name: 配置 ccache
        run: |
          ccache --max-size=3G
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      # ---------- 2. depot_tools ----------
      - name: 安装 depot_tools
        run: |
          git clone --depth 1 \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            "$HOME/depot_tools"
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      # ---------- 3. 拉取 Chromium（分步执行，不依赖 fetch） ----------
      - name: 初始化 Chromium 工作区
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          mkdir -p "$RUNNER_WORKSPACE/chromium"
          cd "$RUNNER_WORKSPACE/chromium"
          echo "WORKSPACE=$RUNNER_WORKSPACE/chromium" >> $GITHUB_ENV

          # 显式写 .gclient，不依赖 fetch 命令
          gclient config --spec 'solutions = [
            {
              "name": "src",
              "url": "https://chromium.googlesource.com/chromium/src.git",
              "managed": True,
              "custom_deps": {},
              "custom_vars": {},
            },
          ]
          target_os = ["android"]
          '

          echo "=== .gclient 内容 ==="
          cat .gclient

      - name: 拉取 Chromium 源码（核心步骤）
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          cd "$WORKSPACE"
          echo "开始: $(date)"
          # --no-history 只拉最新快照，省 60% 体积
          # 不加 --reset-on-error / --retry-failures（已废弃）
          gclient sync --nohooks --no-history -j 8
          echo "结束: $(date)"
          echo "=== 磁盘 ==="
          df -h /
          echo "=== 源码大小 ==="
          du -sh src 2>/dev/null || true

      - name: 切换到指定版本
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          cd "$WORKSPACE/src"
          TAG="${{ github.event.inputs.chromiumTag }}"
          if [[ -n "$TAG" ]]; then
            echo "==> 尝试切换到 tag $TAG"
            git fetch --depth 1 origin "refs/tags/$TAG:refs/tags/$TAG" || \
              git fetch --depth 1 origin tag "$TAG" || true
            git checkout -f "$TAG" 2>/dev/null && echo "✅ 已切到 $TAG" || \
              echo "⚠️ tag 不可用，使用当前 HEAD"
          fi
          git log -1 --oneline
          git describe --tags 2>/dev/null || true

      - name: 同步该版本的依赖
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          cd "$WORKSPACE"
          gclient sync --nohooks --no-history -j 8
          gclient runhooks

      # ---------- 4. Kiwi 补丁 ----------
      - name: 检出 Kiwi 源码
        uses: actions/checkout@v4
        with:
          ref: kiwi
          path: kiwi-patch

      - name: 应用 Kiwi 定制
        run: |
          cd "$GITHUB_WORKSPACE/kiwi-patch"
          echo "=== 补丁文件数 ==="
          find . -type f -not -path "./.git/*" -not -path "./.github/*" | wc -l
          echo "=== 开始覆盖 ==="
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='.build' \
            --exclude='CHROMIUM_VERSION' --exclude='KIWI_VERSION' \
            --exclude='README.md' --exclude='LICENSE' --exclude='*.svg' \
            ./ "$WORKSPACE/src/"
          echo "=== 覆盖完成 ==="
          cd "$WORKSPACE/src"
          git status --short | head -20
          git status --short | wc -l

      # ---------- 5. 签名 ----------
      - name: 生成 keystore
        run: |
          cd "$WORKSPACE"
          keytool -genkeypair -v \
            -keystore keystore.jks -alias kiwi \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass kiwi123456 -keypass kiwi123456 \
            -dname "CN=${{ github.event.inputs.appLabel }}, OU=Self, O=Self, L=CN, C=CN"
          ls -lh keystore.jks

      # ---------- 6. GN ----------
      - name: 生成 args.gn
        run: |
          cd "$WORKSPACE"
          mkdir -p out/android_arm64
          {
            echo 'target_os = "android"'
            echo 'target_cpu = "arm64"'
            echo 'is_debug = false'
            echo 'is_java_debug = false'
            echo ''
            echo 'android_channel = "dev"'
            echo 'is_official_build = true'
            echo 'is_component_build = false'
            echo 'is_chrome_branded = false'
            echo 'is_clang = true'
            echo 'symbol_level = 0'
            echo 'exclude_unwind_tables = true'
            echo 'blink_symbol_level = 0'
            echo ''
            echo 'use_unofficial_version_number = false'
            echo 'android_default_version_code = "1"'
            echo 'android_default_version_name = "KiwiX"'
            echo ''
            echo 'chrome_public_manifest_package = "${{ github.event.inputs.packageName }}"'
            echo ''
            echo 'android_keystore_name = "kiwi"'
            echo 'android_keystore_password = "kiwi123456"'
            echo 'android_keystore_path = "../../keystore.jks"'
            echo ''
            echo 'enable_extensions = true'
            echo 'enable_pdf = false'
            echo 'enable_plugins = false'
            echo 'enable_nacl = false'
            echo 'enable_widevine = true'
            echo 'enable_remoting = false'
            echo 'enable_mse_mpeg2ts_stream_parser = true'
            echo 'rtc_use_h264 = false'
            echo ''
            echo 'proprietary_codecs = true'
            echo 'ffmpeg_branding = "Chrome"'
            echo ''
            echo 'google_api_key = "KIWIBROWSER"'
            echo 'google_default_client_id = "42.apps.kiwibrowser.com"'
            echo 'google_default_client_secret = "KIWIBROWSER_NOT_SO_SECRET"'
            echo 'use_official_google_api_keys = false'
            echo ''
            echo 'v8_use_external_startup_data = true'
            echo 'disable_android_lint = true'
            echo 'treat_warnings_as_errors = false'
            echo 'icu_use_data_file = false'
            echo 'enable_iterator_debugging = false'
            echo 'fieldtrial_testing_like_official_build = true'
            echo ''
            echo 'cc_wrapper = "ccache"'
          } > out/android_arm64/args.gn
          cat out/android_arm64/args.gn

      - name: gn gen
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          cd "$WORKSPACE"
          gn gen out/android_arm64
          echo "=== 构建配置生成成功 ==="
          head -20 out/android_arm64/args.gn

      # ---------- 7. 编译 ----------
      - name: 编译
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          cd "$WORKSPACE"
          echo "开始编译: $(date)"
          df -h /
          autoninja -C out/android_arm64 -j 4 chrome_public_apk
          echo "编译完成: $(date)"
          ccache -s || true

      # ---------- 8. 产物 ----------
      - name: 收集并上传
        if: always()
        run: |
          cd "$WORKSPACE" || exit 0
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          find out/android_arm64/apks -name "*.apk" -exec cp -v {} "$GITHUB_WORKSPACE/artifacts/" \; 2>/dev/null || echo "未找到 APK"
          ls -lh "$GITHUB_WORKSPACE/artifacts/" 2>/dev/null || true

      - name: 上传 APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiwi-arm64-apk
          path: ${{ github.workspace }}/artifacts/*.apk
          retention-days: 30
          if-no-files-found: warn
