# =============================================================================
# 【已弃用 / DEPRECATED】此 workflow 不再使用，请勿触发。
# 原因：GitHub-hosted runner（ubuntu-latest，4 核 / 350 分钟 / 125GB）无法
#       完成 Chromium Android 全量编译。且 forks 的 kiwi 分支只是稀疏 overlay，
#       官方 CI 本身从不 gn gen / 编译，只 rclone 下载 buildbot 预编译产物。
#       多轮实证（42367227588 / 42372288551 / 42376961691 等）均失败在 gn gen。
# 现行方案：基于 Kiwi 官方 Release 的 arm64 成品 APK 做定制重打包，
#           成品见 dist/KiwiX-v137.0.7337.0-arm64.apk 与 dist/说明.txt
# -----------------------------------------------------------------------------
# KiwiX 构建 v9 —— 修正基线：Chromium 105.0.5195.24 + Kiwi overlay
# =============================================================================
# 【v1~v8 全部失败的根本原因，已从仓库结构确诊】
#
#   之前的流程：
#     gclient sync 拉 upstream 132.0.6834.83
#     → rsync 仓库 `chromium` 分支到源码树（声称是「Kiwi 已 rebase 的增量」）
#     → 结果：`chromium` 分支其实是 kiwibrowser/src.next 的【纯上游镜像】，
#       每次 commit 都是 "[Chromium] Update version X to Y"，不含任何 Kiwi 代码。
#       证据：chrome/browser/extensions/BUILD.gn 与官方 132 字节级一致（63603B），
#             chrome/android/java/.../browser/ 下 66 个条目无一个 extensions 目录。
#     → 等于「纯 upstream 132 + enable_extensions=true」，这是官方从未验证的组合，
#       于是逐层撞 assert，v1~v8 修了 8 处仍在第 9 处失败
#       （chrome/browser/search/background，桌面 views 组件）。
#
#   正确事实：
#     kiwi 分支（默认分支）才是 Kiwi 的【补丁 overlay】，根目录只有
#       base/ chrome/ components/ content/ extensions/ net/ remoting/
#       services/ third_party/ toolbox/ ui/
#     11 个目录 = 只含被改过的文件。
#     其 CHROMIUM_VERSION = 105.0.5195.24，KIWI_VERSION = 105.0.5195.33
#     —— 即 Kiwi Browser 停更时的真实基线是 105，不是 132。
#     官方 .build/production_build_reference/args.gn 同样是
#       enable_extensions = true + target_os = android，可正常出包。
#     官方 `chrome/browser/extensions/BUILD.gn`（overlay 版）1441 行，
#       已剔除 search/background、views/toolbar、views/side_panel、themes
#       等全部桌面依赖 —— 这才是它能编译的原因。
#
#   v9 因此：
#     1. 基线改回 105.0.5195.24
#     2. rsync 来源改为 `kiwi` 分支（真补丁）
#     3. 删除 v1~v8 的 8 处 assert 修补（105 不需要，强行套用会 exit 1）
#     4. args 对齐官方 production_build_reference
# =============================================================================

name: 'Kiwi: GitHub-hosted Build arm64'

on:
  workflow_dispatch:
    inputs:
      packageName:
        description: 'APK 包名'
        required: true
        default: 'com.lengxiaobing.kiwi'
      appLabel:
        description: 'APP 显示名称'
        required: true
        default: 'KiwiX'
      chromiumTag:
        description: 'Chromium tag（必须与 kiwi overlay 的 CHROMIUM_VERSION 一致）'
        required: true
        default: '105.0.5195.24'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      # ================= 1. 腾空间 =================
      - name: 极限清理磁盘
        run: |
          echo "=== 清理前 ==="
          df -h /

          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile || true

          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/local/lib/node_modules || true
          sudo rm -rf /opt/hostedtoolcache || true

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* || true
          sudo rm -rf /var/cache/apt/archives/* || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /imagegeneration || true
          sudo rm -rf /usr/lib/jvm/*/jmods || true
          sudo rm -rf /usr/share/ri || true
          sudo rm -rf /usr/local/go || true
          sudo rm -rf /opt/google || true
          docker image prune -af || true

          echo "=== 清理后 ==="
          df -h /

      - name: 检查磁盘（要求 >=110GB 可用）
        run: |
          AVAIL=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "可用空间: ${AVAIL}GB"
          if (( AVAIL < 40 )); then
            echo "::error::磁盘不足 40GB，无法继续"
            exit 1
          fi
          if (( AVAIL < 60 )); then
            echo "::warning::磁盘仅 ${AVAIL}GB，将启用精简构建"
            echo "LEAN_BUILD=1" >> "${GITHUB_ENV}"
          fi

      # ================= 2. 依赖 =================
      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          # 必需包：一个都不能少，缺了要显式失败，绝不能用 || true 掩盖
          # （apt 是整批原子安装，混入一个不存在的包会导致整批不装）
          sudo apt-get install -y -qq \
            python3 python3-pip python3-venv \
            openjdk-17-jdk-headless \
            ccache ninja-build pkg-config file
          # 可选运行时库：新版 runner 可能已移除，装不上不影响编译
          # libgconf-2-4 在 ubuntu-24.04 已删除，不放入必需清单
          sudo apt-get install -y -qq libnss3-dev libpci3 || true
          java -version 2>&1 | head -2
          python3 --version
          ccache --max-size=2G
          echo "CCACHE_DIR=${HOME}/.ccache" >> "${GITHUB_ENV}"

      - name: 安装 depot_tools
        run: |
          git clone --depth 1 \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            "$HOME/depot_tools"
          echo "${HOME}/depot_tools" >> "${GITHUB_PATH}"

      # ================= 3. 单次 gclient sync（锁定 105） =================
      - name: 配置 .gclient（版本直接写入 URL，只 sync 一次）
        run: |
          WS="${RUNNER_WORKSPACE}/chromium"
          mkdir -p "$WS"
          cd "$WS"
          echo "WORKSPACE=${WS}" >> "${GITHUB_ENV}"

          TAG="${{ github.event.inputs.chromiumTag }}"

          # custom_vars 关闭 traffic_annotation_auditor 下载 hook。
          # 该二进制仅用于「网络流量标注审计」，编译 Android APK 完全不需要；
          # 且 105 时代它对应的 GCS 对象已被 Google 从存储桶删除，
          # runhooks 会报 "No URLs matched" 并整体失败（exit 2）。
          # 105 的 DEPS 里变量名是 checkout_traffic_annotation_tools，
          # hook 条件为 host_os == "linux" and checkout_traffic_annotation_tools，
          # 设为 False 即可精准跳过，不影响其他任何 hook。
          cat > .gclient <<EOF
          solutions = [
            {
              "name": "src",
              "url": "https://chromium.googlesource.com/chromium/src.git@${TAG}",
              "managed": True,
              "custom_deps": {},
              "custom_vars": {
                "checkout_traffic_annotation_tools": False,
              },
            },
          ]
          target_os = ["android"]
          EOF

          echo "=== .gclient ==="
          cat .gclient

      - name: gclient sync（唯一一次，锁定版本）
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          cd "$WORKSPACE"
          echo "开始: $(date)"
          df -h /
          gclient sync --nohooks --no-history --shallow -j 8
          echo "结束: $(date)"
          echo "=== 磁盘 ==="
          df -h /
          echo "=== 源码体积 ==="
          du -sh src 2>/dev/null || true
          echo "=== 验证版本（必须看到 105.0.5195.24）==="
          cd src && git log -1 --oneline

      - name: 运行 hooks（下载工具链 / Android SDK）
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          cd "$WORKSPACE"
          df -h /
          # 步骤默认是 bash -e：runhooks 一旦非 0 会立即终止，后面的护栏根本跑不到。
          # 因此显式捕获退出码，把裁决权交给「编译必需组件」校验：
          #   - 非必需的老 GCS 对象失效 → 放行（记录警告）
          #   - 但编译必需的工具链缺失   → 明确失败，绝不掩盖
          RC=0
          gclient runhooks || RC=$?
          echo "=== runhooks 退出码: ${RC} ==="
          if [ "${RC}" -ne 0 ]; then
            echo "::warning::runhooks 返回非 0，仅当编译必需组件齐全时放行"
          fi
          echo "=== 校验编译必需组件（缺任一个即失败）==="
          # 用标准 if 而非 "A && B || C"：后者会触发 shellcheck SC2015
          # （"A && B || C is not if-then-else"），导致 Lint workflow 报红。
          if [ -f src/third_party/llvm-build/Release+Asserts/bin/clang ]; then
            echo "OK clang"
          else
            echo "::error::clang 缺失"
            exit 1
          fi
          if [ -d src/build/linux/debian_bullseye_amd64-sysroot ]; then
            echo "OK sysroot"
          else
            echo "::error::sysroot 缺失"
            exit 1
          fi
          if [ -f src/third_party/node/linux/node-linux-x64/bin/node ]; then
            echo "OK node"
          else
            echo "::error::node 缺失"
            exit 1
          fi
          echo "=== hooks 阶段完成 ==="
          df -h /

      # ================= 4. 应用 Kiwi overlay =================
      - name: 检出 Kiwi overlay 与构建配置（kiwi 分支）
        uses: actions/checkout@v4
        with:
          ref: kiwi
          path: config

      - name: 校验 overlay 完整性
        run: |
          cd "$GITHUB_WORKSPACE/config"
          echo "=== CHROMIUM_VERSION（应为 105.0.5195.24）==="
          cat CHROMIUM_VERSION
          echo "=== overlay 顶层目录 ==="
          ls -1
          # 硬性校验：若 overlay 目录缺失，说明检出错了分支，立即失败
          for d in chrome extensions components; do
            if [ ! -d "$d" ]; then
              echo "::error::overlay 缺少目录 $d，分支检出不正确"
              exit 1
            fi
          done
          echo "=== 关键文件存在性 ==="
          test -f chrome/browser/extensions/BUILD.gn && echo "OK chrome/browser/extensions/BUILD.gn"
          test -f extensions/browser/BUILD.gn && echo "OK extensions/browser/BUILD.gn"

      - name: 应用 Kiwi 定制（rsync overlay 到源码树）
        run: |
          cd "$GITHUB_WORKSPACE/config"
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='.build' \
            --exclude='CHROMIUM_VERSION' --exclude='KIWI_VERSION' --exclude='VERSION' \
            --exclude='README.md' --exclude='LICENSE' --exclude='*.svg' \
            --exclude='args-kiwi.gn' --exclude='args-kiwi-105.gn' \
            ./ "$WORKSPACE/src/"

          cd "$WORKSPACE/src"
          echo "=== 覆盖文件数（应数千量级；若为 0 说明 overlay 没生效）==="
          git status --short | wc -l

          # 关键断言：overlay 必须真的改到了扩展层
          echo "=== 校验：Kiwi 的 extensions BUILD.gn 已生效（应无 views/side_panel）==="
          if grep -q 'ui/views/side_panel' chrome/browser/extensions/BUILD.gn; then
            echo "::error::chrome/browser/extensions/BUILD.gn 仍是桌面版，overlay 未生效"
            exit 1
          fi
          echo "OK: 已替换为 Kiwi 裁剪版"
          grep -c 'enable_extensions' chrome/browser/extensions/BUILD.gn || true

      # ============ 4.5 静态消除桌面 BUILD.gn 平台断言（构建前一次性）============
      # 根因（run42367227588 / run42372288551 两轮完整日志 + 上游/overlay diff 核实）：
      #   kiwi 分支是稀疏 overlay（顶层仅 22 项）；官方编译用的是「Kiwi 已把
      #   所有 BUILD.gn 断言改好」的完整源码树，官方 CI workflow 本身根本不 gn gen
      #   （只生成 args.gn，再 rclone 下载 buildbot 预编译产物）。本构建用上游
      #   105 镜像 + overlay 拼装，overlay 又用 "|| true" 强行把桌面 WebUI 资源
      #   引入安卓，于是上游残留的顶层平台断言必然触发。
      # 修复：gn gen 之前一次性全局注释所有 BUILD.gn 里的「顶层纯平台断言」，
      #   等价于还原官方源码树；打印完整清单，命中过少即拒绝继续。
      #   运行时循环改写（上一版空转 80 轮未落盘一次）已废弃。
      - name: 静态消除桌面 BUILD.gn 平台断言
        run: |
          cd "$WORKSPACE/src"
          python3 - <<'PYEOF'
          import os, re, sys

          PLATFORM = ("is_chromeos_lacros", "is_chromeos_ash", "is_desktop_android",
                      "is_chromeos", "is_android", "is_fuchsia", "is_castos",
                      "is_linux", "is_mac", "is_win", "is_ios", "is_posix",
                      "is_apple", "is_bsd", "toolkit_views", "use_aura")
          PAT = re.compile(r"^assert\(([^)]*)\)\s*$")

          def is_platform_expr(expr):
              # 兼容 assert(平台表达式, "message")：只判断第一个逗号前的条件部分
              core = expr.split(",")[0]
              tmp = core
              for kw in PLATFORM:
                  tmp = tmp.replace(kw, "")
              tmp = re.sub(r"[\s!&|()]", "", tmp)
              return tmp == "" and any(k in core for k in PLATFORM)

          changed = []
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in (".git", "out")]
              for fn in files:
                  if fn != "BUILD.gn":
                      continue
                  fp = os.path.join(root, fn)
                  try:
                      lines = open(fp, errors="ignore").read().splitlines(keepends=True)
                  except OSError:
                      continue
                  hit = 0
                  for i, l in enumerate(lines):
                      m = PAT.match(l.strip())
                      if m and is_platform_expr(m.group(1)):
                          lines[i] = "  # [android-cut] " + l.lstrip()
                          hit += 1
                  if hit:
                      open(fp, "w").write("".join(lines))
                      changed.append((fp[2:], hit))

          changed.sort()
          total = sum(h for _, h in changed)
          print("=== 顶层平台断言改写：%d 个文件 / %d 处 ===" % (len(changed), total), flush=True)
          for fp, h in changed:
              print("   %-70s %d 处" % (fp, h), flush=True)
          if len(changed) < 15:
              print("::error::仅命中 %d 个文件（应 >=15），源码树或规则异常，拒绝继续" % len(changed))
              sys.exit(1)
          PYEOF

      # ================= 5. 签名 =================
      - name: 生成 keystore
        run: |
          cd "$WORKSPACE/src"
          keytool -genkeypair -v \
            -keystore keystore.jks -alias kiwi \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass kiwi123456 -keypass kiwi123456 \
            -dname "CN=${{ github.event.inputs.appLabel }}, OU=Self, O=Self, L=CN, C=CN" 2>&1 | tail -3
          ls -lh keystore.jks

      # ================= 6. GN =================
      - name: 生成 args.gn
        run: |
          cd "$WORKSPACE/src"
          mkdir -p out/android_arm64
          cp "$GITHUB_WORKSPACE/config/args-kiwi.gn" out/android_arm64/args.gn
          sed -i "s|__PKG__|${{ github.event.inputs.packageName }}|" out/android_arm64/args.gn
          sed -i "s|__LABEL__|${{ github.event.inputs.appLabel }}|" out/android_arm64/args.gn
          echo "===== args.gn ====="
          cat out/android_arm64/args.gn

      # ============ 6.5 裁剪 gn_all 桌面测试目标（安卓）============
      # 105 上游 gn_all 在 enable_extensions=true 时会拉入 extensions/shell
      # 系列桌面测试目标，触发 keep_alive_registry 的 assert(!is_android)。
      # 安卓官方构建默认 enable_extensions=false，本就不进入这些块，
      # 所以在安卓下显式排除等价于官方配置。chrome_public_apk 由同文件的
      # traffic_annotation_auditor_dependencies(is_android) 独立可达，不受影响。
      - name: 裁剪 gn_all 桌面测试目标（安卓）
        run: |
          cd "$WORKSPACE/src"
          python3 - <<'PYEOF'
          import os
          import sys

          p = "BUILD.gn"
          s = open(p).read()
          patches = [
            (
              "  if (enable_extensions) {\n"
              "    deps += [\n"
              "      \"//extensions:extensions_browsertests\",\n"
              "      \"//extensions:extensions_unittests\",\n"
              "      \"//extensions/browser/api/declarative_net_request/filter_list_converter\",\n"
              "      \"//extensions/shell:app_shell_unittests\",\n"
              "    ]\n"
              "  }",
              "  if (enable_extensions && !is_android) {\n"
              "    deps += [\n"
              "      \"//extensions:extensions_browsertests\",\n"
              "      \"//extensions:extensions_unittests\",\n"
              "      \"//extensions/browser/api/declarative_net_request/filter_list_converter\",\n"
              "      \"//extensions/shell:app_shell_unittests\",\n"
              "    ]\n"
              "  }",
            ),
            (
              "    if (enable_extensions) {\n"
              "      deps += [ \"//extensions/shell:app_shell\" ]\n"
              "    }",
              "    if (enable_extensions && !is_android) {\n"
              "      deps += [ \"//extensions/shell:app_shell\" ]\n"
              "    }",
            ),
          ]
          for old, new in patches:
              n = s.count(old)
              if n != 1:
                  print("::error::锚点匹配 %d 次（应为 1），拒绝静默放行" % n)
                  print("片段: " + repr(old[:100]))
                  sys.exit(1)
              s = s.replace(old, new, 1)
              print("OK 裁剪: " + new.splitlines()[0].strip())
          # 更彻底的一步：gn_all 全量清单共 788 行，会不断拉进新的桌面
          # 测试目标（guest_view / extensions_shell / chrome_test ...），
          # 逐处切断没有尽头。安卓构建并不需要这些测试目标，APK 由
          # traffic_annotation_auditor_dependencies(is_android) 独立可达。
          # 故把整个 gn_all 按平台短路：安卓下只保留 APK 入口，
          # 原内容原样放进 else（非安卓行为完全不变）。
          lines = s.splitlines(keepends=True)
          try:
              start = next(i for i, l in enumerate(lines)
                           if l.startswith('group("gn_all")'))
              end = next(i for i in range(start + 1, len(lines))
                         if lines[i].rstrip("\r\n") == "}")
          except StopIteration:
              print("::error::未定位到 gn_all 边界，拒绝继续")
              sys.exit(1)
          body = lines[start + 1:end]
          wrapped = (["  if (is_android) {\n",
                      "    # 安卓只生成 APK 依赖链，跳过全量桌面测试目标\n",
                      "    deps = [ \"//chrome/android:chrome_public_apk\" ]\n",
                      "  } else {\n"]
                     + body + ["  }\n"])
          lines[start + 1:end] = wrapped
          s = "".join(lines)
          print("=== gn_all 按平台短路：安卓 %d 行 -> 3 行 ===" % len(body))

          open(p, "w").write(s)
          print("=== 根 BUILD.gn 裁剪完成 ===")

          # 家长控制的 ChromeOS 专用块：args 里虽已设
          # enable_supervised_users=false，但 GN 加载整个 BUILD.gn 时
          # 仍会执行文件内的 assert(is_chromeos)（run24 暴露）。
          # 注释 deps 引用挡不住文件级断言，故在源码层直接给这些块
          # 加 !is_android 保护，覆盖 chrome/browser 与 ui 两处同款块。
          old_su = "if (enable_supervised_users && enable_extensions) {"
          new_su = "if (enable_supervised_users && enable_extensions && !is_android) {"
          for fp in ["chrome/browser/BUILD.gn", "chrome/browser/ui/BUILD.gn"]:
              if not os.path.isfile(fp):
                  print("::warning::%s 不存在，跳过" % fp)
                  continue
              t = open(fp).read()
              n = t.count(old_su)
              if n == 0:
                  print("::warning::%s 未找到该块（overlay 可能已裁剪）" % fp)
                  continue
              open(fp, "w").write(t.replace(old_su, new_su))
              print("=== %s: %d 处家长控制块加 !is_android 保护 ===" % (fp, n))

          # 诊断：全树扫描并把仍引用 extensions/shell 的 BUILD.gn 写进日志，
          # 若 GN 后续还报桌面链，可据此一次看清剩余入口。
          hits = []
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d != ".git"]
              for f in files:
                  if f != "BUILD.gn":
                      continue
                  fp = os.path.join(root, f)
                  try:
                      t = open(fp, errors="ignore").read()
                  except OSError:
                      continue
                  if '"//extensions/shell' in t:
                      hits.append(fp)
          print("=== 仍引用 //extensions/shell 的 BUILD.gn 共 %d 个 ===" % len(hits))
          for x in hits[:30]:
              print("   ", x)
          PYEOF

      - name: gn gen
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          cd "$WORKSPACE/src"
          echo "=== gn gen（单次执行；源码已在「静态消除平台断言」步骤改写完成）==="
          gn gen out/android_arm64
          echo "=== gn gen 成功 ==="
          df -h /

      # ================= 7. 编译 =================
      - name: 编译
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          cd "$WORKSPACE/src"
          echo "编译开始: $(date)"
          df -h /
          autoninja -C out/android_arm64 -j 4 chrome_public_apk
          echo "编译完成: $(date)"
          ccache -s || true
          df -h /

      # ================= 8. 产物 =================
      - name: 收集 APK
        if: success()
        run: |
          cd "$WORKSPACE/src" 2>/dev/null || exit 0
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          find out/android_arm64/apks -name "*.apk" -exec cp -v {} "$GITHUB_WORKSPACE/artifacts/" \; 2>/dev/null || echo "未找到 APK"
          ls -lh "$GITHUB_WORKSPACE/artifacts/" 2>/dev/null || true

      - name: 上传 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kiwi-arm64-apk
          path: ${{ github.workspace }}/artifacts/*.apk
          retention-days: 30
